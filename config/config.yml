bronze:
  batch_table: ohlc_batch
  eventhub_ticks: ticks_bronze
  zerobus_ticks: ticks_zerobus_raw
  
  columns:
    - entry_id
    - symbol
    - timestamp_unix
    - source
    - open
    - high
    - low
    - close
    - vwap
    - volume
    - trade_count
    - event_timestamp
    - ingestion_timestamp

silver:
  table: ohlc_prices
  ticks_table: ticks_silver
  quarantine_table: ticks_quarantine
  validated_view: _ticks_validated

  columns:
    - entry_id
    - symbol
    - timestamp_unix
    - source
    - quote_currency
    - open
    - high
    - low
    - close
    - vwap
    - volume
    - trade_count
    - event_time
    - ingestion_timestamp

  business_key: entry_id

gold:
  tables:
    fact_ohlc_hourly: fact_ohlc_hourly
    fact_price_tick: fact_price_tick
    dim_asset: dim_asset
    dim_date: dim_date
    dim_source: dim_source
    access_rules: access_rules

  start_date: "2025-01-01"
  end_date: "2030-12-31"

  reader_group: students
  reviewer_email: lbiel@softserve.academy

  rls_function: rls_asset_filter
  cls_function: cls_mask_volume

  filtered_facts:
    - fact_ohlc_hourly
    - fact_price_tick

  masked_columns:
    - table: fact_ohlc_hourly
      column: volume
    - table: fact_price_tick
      column: volume_24h

  reader_tables:
    - dim_asset
    - dim_date
    - dim_source
    - fact_ohlc_hourly
    - fact_price_tick

api:
  url: https://api.kraken.com/0/public/OHLC
  interval: 60

streaming:
  api_url: https://api.coingecko.com/api/v3/simple/price
  symbols:
    - bitcoin
    - ethereum
    - solana
  symbol_map:
    bitcoin: BTC
    ethereum: ETH
    solana: SOL
    btc: BTC
    eth: ETH
    sol: SOL
  source_label: streaming
  quote_currency: USD
  watermark: 10 minutes
  future_tolerance: 5 MINUTES
  min_event_epoch: 1230768000.0
  max_event_epoch: 4102444799.0
  poll_seconds: 10
  iterations: 30
  bad_every: 0
  include_volume: false
  secret_scope: team-crypto-scope

  eventhub:
    namespace: evhua5816bd
    name: crypto-ticks
    connection_secret_key: eventhub-connection-string
    port: 9093
    starting_offsets: earliest
    fail_on_data_loss: "false"
    source_label: eventhub

  zerobus:
    endpoint: https://7405604651938730.zerobus.eastus.azuredatabricks.net
    client_id_secret_key: team-crypto-zerobus-client-id
    client_secret_secret_key: team-crypto-zerobus-client-secret
    source_label: zerobus

# AI assistant (RAG + tool-calling agent). Job parameters from the bundle
# override these per target; see ai_assistant/README.md.
ai:
  schema: team_crypto_ai
  kb_table: kb_documents
  vector_search_endpoint: crypto-assistant-vs
  vector_index: kb_documents_index
  embedding_endpoint: databricks-gte-large-en
  llm_endpoint: databricks-llama-4-maverick
  model_name: crypto_assistant
  serving_endpoint: crypto-assistant-dev
  warehouse_id: ""
  use_obo: true
  experiment_path: /Shared/crypto-assistant-dev
  # minimum mean score per judge; the model is not deployed below these
  eval_thresholds:
    safety: 1.0
    no_financial_advice: 0.9
    relevance_to_query: 0.8
    correctness: 0.7
    retrieval_groundedness: 0.7