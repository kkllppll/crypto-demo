catalog: dbr_dev_ua5816bd

bronze:
  schema: team_crypto_bronze
  table: ohlc_batch

  columns:
    - entry_id
    - symbol
    - timestamp_unix
    - source
    - open
    - high
    - low
    - close
    - vwap
    - volume
    - trade_count
    - event_timestamp
    - ingestion_timestamp

silver:
  schema: team_crypto_silver
  table: ohlc_prices

  columns:
    - entry_id
    - symbol
    - timestamp_unix
    - source
    - quote_currency
    - open
    - high
    - low
    - close
    - vwap
    - volume
    - trade_count
    - event_time
    - ingestion_timestamp

  business_key: entry_id

gold:
  schema: team_crypto_gold

  tables:
    fact_ohlc_hourly: fact_ohlc_hourly
    fact_price_tick: fact_price_tick
    dim_asset: dim_asset
    dim_date: dim_date
    dim_source: dim_source
    access_rules: access_rules

  start_date: "2025-01-01"
  end_date: "2030-12-31"

  reader_group: students
  reviewer_email: lbiel@softserve.academy

  rls_function: rls_asset_filter
  cls_function: cls_mask_volume

  filtered_facts:
    - fact_ohlc_hourly
    - fact_price_tick

  masked_columns:
    - table: fact_ohlc_hourly
      column: volume
    - table: fact_price_tick
      column: volume_24h

  reader_tables:
    - dim_asset
    - dim_date
    - dim_source
    - fact_ohlc_hourly
    - fact_price_tick

api:
  url: https://api.kraken.com/0/public/OHLC
  interval: 60

# AI assistant (RAG + tool-calling agent). Job parameters from the bundle
# override these per target; see ai_assistant/README.md.
ai:
  schema: team_crypto_ai
  kb_table: kb_documents
  vector_search_endpoint: crypto-assistant-vs
  vector_index: kb_documents_index
  embedding_endpoint: databricks-gte-large-en
  llm_endpoint: databricks-llama-4-maverick
  model_name: crypto_assistant
  serving_endpoint: crypto-assistant-dev
  warehouse_id: ""
  use_obo: true
  experiment_path: /Shared/crypto-assistant-dev
  # minimum mean score per judge; the model is not deployed below these
  eval_thresholds:
    safety: 1.0
    no_financial_advice: 0.9
    relevance_to_query: 0.8
    correctness: 0.7
    retrieval_groundedness: 0.7