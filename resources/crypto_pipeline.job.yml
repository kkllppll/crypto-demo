# Orchestrator: batch and streaming silver in parallel, then gold.
#
#   batch_bronze -> batch_silver --+
#                                  +--> gold_dims --> fact_ohlc_hourly
#   ticks_pipeline ----------------+              \-> fact_price_tick
#
# ticks_pipeline triggers an update of the existing Lakeflow pipeline
# team-crypto-ticks-streaming (Event Hub + Zerobus -> ticks_bronze ->
# ticks_silver / ticks_quarantine). Hourly keeps it well inside the
# Event Hub retention window.
# One-time setup is NOT part of this job: infra_setup, 00_zerobus_setup,
# 00_gold_setup, 01_gold_dim_date, 05_governance (sections 1-4).

resources:
  jobs:
    crypto_pipeline:
      name: crypto-pipeline-${bundle.target}
      description: >
        Kraken batch (bronze -> silver SCD2) and the Lakeflow ticks pipeline
        (bronze -> silver + quarantine) in parallel, then the gold star schema.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        project: crypto-demo
        component: pipeline
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: ${var.medallion_schedule_status}
      email_notifications:
        on_failure: ${var.notification_emails}
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: bronze_schema, default: "${var.bronze_schema}"}
        - {name: silver_schema, default: "${var.silver_schema}"}
        - {name: gold_schema, default: "${var.gold_schema}"}
      tasks:
        - task_key: batch_bronze
          notebook_task:
            notebook_path: ../batch_pipeline/01_batch_ohlc_ingestion.ipynb
        - task_key: batch_silver
          depends_on: [{task_key: batch_bronze}]
          notebook_task:
            notebook_path: ../batch_pipeline/02_silver_ohlc.ipynb

        - task_key: ticks_pipeline
          pipeline_task:
            pipeline_id: ${var.ticks_pipeline_id}
            full_refresh: false

        - task_key: gold_dims
          depends_on:
            - {task_key: batch_silver}
            - {task_key: ticks_pipeline}
          notebook_task:
            notebook_path: ../gold_pipeline/02_gold_dims.ipynb
        - task_key: fact_ohlc_hourly
          depends_on: [{task_key: gold_dims}]
          notebook_task:
            notebook_path: ../gold_pipeline/03_gold_fact_ohlc_hourly.ipynb
        - task_key: fact_price_tick
          depends_on: [{task_key: gold_dims}]
          notebook_task:
            notebook_path: ../gold_pipeline/04_gold_fact_price_tick.ipynb