
name: Crypto Lakehouse CI

on:
  push:
    branches:
      - feature/github-actions-ci-cd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: PySpark Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pyspark==3.5.6" chispa

      - name: Run PySpark unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          python -m pytest \
            tests/test_ticks_transformations.py \
            tests/test_gold_transformations.py \
            tests/test_zerobus_transformations.py \
            -v
