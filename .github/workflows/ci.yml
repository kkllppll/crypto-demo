
name: Crypto Lakehouse CI

on:
  push:
    branches:
      - feature/github-actions-ci-cd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: PySpark Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pyspark==3.5.6" chispa

      - name: Run PySpark unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          python -m pytest \
            tests/test_ticks_transformations.py \
            tests/test_gold_transformations.py \
            tests/test_zerobus_transformations.py \
            tests/test_silver_scd2.py \
            -v
    
  ai-tests:
    name: AI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install AI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pyspark==3.5.6" "mlflow>=3,<4" "databricks-sdk>=0.67" "PyYAML>=6,<7"

      - name: Run AI unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
          CRYPTO_AGENT_SKIP_AUTOLOG: "1"
        run: |
          python -m pytest \
            tests/test_agent.py \
            tests/test_ai_settings.py \
            tests/test_kb_builder.py \
            -v -ra
    

  dab-validation:
    name: Databricks Bundle Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks CLI version
        run: databricks version

   
      - name: Install YAML validator
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate YAML syntax
        run: |
          python -c "import glob, yaml; files = ['databricks.yml'] + glob.glob('resources/*.yml'); [yaml.safe_load(open(f, encoding='utf-8')) for f in files]; print(f'Validated {len(files)} YAML files')"
        
      - name: Check Databricks authentication
        env:
          DATABRICKS_AUTH_TYPE: azure-client-secret
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: databricks current-user me

      - name: Validate DEV Databricks Bundle
        env:
          DATABRICKS_AUTH_TYPE: azure-client-secret
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: databricks bundle validate -t dev

      - name: Preview DEV deployment plan
        env:
          DATABRICKS_AUTH_TYPE: azure-client-secret
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: databricks bundle plan -t dev


  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - ai-tests
      - dab-validation

    steps:
      - name: Confirm CI checks
        run: echo "All required CI checks passed."
